services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY_HOPS: "1"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}@mongo:27017/hawma?authSource=hawma
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      SUPPORT_SECRET: ${SUPPORT_SECRET:?Set SUPPORT_SECRET in .env}
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: hawma
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongodb_data:/data/db
      - ./server/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-backup:
    image: mongo:7
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}@mongo:27017/hawma?authSource=hawma
    volumes:
      - mongodb_backups:/backups
    entrypoint:
      - /bin/sh
      - -ec
      - |
        while true; do
          backup="/backups/hawma-$$(date -u +%Y%m%dT%H%M%SZ).archive.gz"
          mongodump --uri="$$MONGODB_URI" --archive="$$backup" --gzip
          find /backups -type f -name 'hawma-*.archive.gz' -mtime +14 -delete
          sleep 86400
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HAWMA_DOMAIN: ${HAWMA_DOMAIN:?Set HAWMA_DOMAIN in .env}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongodb_data:
  mongodb_backups:
  caddy_data:
  caddy_config:
